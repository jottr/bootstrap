# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Hooks with no stages list run at pre-commit only; gitlint sets commit-msg itself.
default_stages: [pre-commit]
repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-json

      - id: check-yaml
        args: [--unsafe]
      - id: detect-private-key
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/ansible-community/ansible-lint.git
    rev: v25.6.1
    hooks:
      - id: ansible-lint
        always_run: false

  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.29
    hooks:
      - id: tofu-fmt
      - id: tofu-validate
      - id: tflint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Uses the gitleaks from packages.yaml; no Go toolchain download.
      - id: gitleaks-system
        pass_filenames: false  # it scans the staged diff; filenames break its CLI

  - repo: local
    hooks:
      - id: op-references-only
        name: secrets.env holds only op:// references
        language: system
        files: (^|/)secrets\.env$
        # Reports file:line only, never the offending value.
        entry: >-
          sh -c 'bad=$(grep -HnvE "^[[:space:]]*((export[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*=[\"'\'']?op://|#|$)" "$@" | cut -d: -f1-2);
          [ -z "$bad" ] || { printf "%s: not an op:// reference\n" $bad >&2; exit 1; }' --
